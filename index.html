<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- No indexing - keep site private -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    
    <title>Cameron Jim | Software Engineer</title>
    <meta name="description" content="Personal portfolio of Cameron Jim, Software Engineer" />
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <script>
      // Apply the persisted theme before React paints — prevents a flash of the
      // wrong theme. 'lofi' (light) and 'business' (dark) are daisyUI themes.
      (function () {
        var stored = localStorage.getItem('theme');
        var theme = (stored === 'lofi' || stored === 'business')
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'business' : 'lofi');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
