<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>gbemu</title>
<!--
  Bare shell for the gbemu browser build (index.js + index.wasm, pulled in by
  scripts/update-emulator.sh). It is framed by /play, which draws the Game Boy around it and
  sends commands with postMessage:
    parent -> frame  { type: 'gbemu:load', rom: 'tetris.gb' }   load a game from roms/
                     { type: 'gbemu:focus' }                    give the canvas keyboard focus
    frame -> parent  { type: 'gbemu:status', state, rom?, message? }
  Messages are only accepted from, and only sent to, this page's own origin.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1a12; }
  /* /play sizes this frame at exactly 320x288 (2x the Game Boy screen) and scales the frame
     itself, because the emulator draws at whole-number scales of whatever size it measures. */
  canvas {
    display: block; width: 100% !important; height: 100% !important;
    image-rendering: pixelated; outline: none; background: #0f1a12;
  }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<script>
  var ORIGIN = location.origin;
  var canvas = document.getElementById('canvas');

  function post(msg) {
    if (window.parent !== window) { window.parent.postMessage(msg, ORIGIN); }
  }

  var Module = {
    canvas: canvas,
    // battery saves live in IndexedDB so they survive a reload; nothing loads until the first
    // sync, so a game never boots ahead of its own save file
    onRuntimeInitialized: function () {
      FS.mkdir('/saves');
      FS.mount(IDBFS, {}, '/saves');
      FS.syncfs(true, function (err) {
        if (err) { console.warn('saves unavailable', err); }
        post({ type: 'gbemu:status', state: 'ready' });
      });
    }
  };

  function loadBytes(bytes, name) {
    var ptr = Module._malloc(bytes.length);
    Module.HEAPU8.set(bytes, ptr);
    Module.ccall('wasm_load_rom', null, ['number', 'number', 'string'], [ptr, bytes.length, name]);
    Module._free(ptr);
    canvas.focus();
  }

  window.addEventListener('message', function (e) {
    if (e.origin !== ORIGIN || !e.data) { return; }
    if (e.data.type === 'gbemu:focus') { canvas.focus(); }
    if (e.data.type !== 'gbemu:load') { return; }
    var rom = String(e.data.rom);
    // only the bundled roms, never a path or URL from the message
    if (!/^[a-z0-9-]+\.gbc?$/.test(rom)) { return; }
    post({ type: 'gbemu:status', state: 'loading', rom: rom });
    fetch('roms/' + rom).then(function (r) {
      if (!r.ok) { throw new Error(r.status + ' ' + r.statusText); }
      return r.arrayBuffer();
    }).then(function (buf) {
      loadBytes(new Uint8Array(buf), rom);
      post({ type: 'gbemu:status', state: 'playing', rom: rom });
    }).catch(function (err) {
      post({ type: 'gbemu:status', state: 'error', rom: rom, message: err.message });
    });
  });

  canvas.addEventListener('mousedown', function () { canvas.focus(); });
  // a tab switch or a close flushes the battery save straight away
  function flush() {
    if (Module._wasm_save_now) { Module._wasm_save_now(); }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') { flush(); }
  });
  window.addEventListener('pagehide', flush);

  // arrows and space would otherwise scroll
  window.addEventListener('keydown', function (e) {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(e.key) >= 0) {
      e.preventDefault();
    }
  });
</script>
<script async src="index.js"></script>
</body>
</html>
